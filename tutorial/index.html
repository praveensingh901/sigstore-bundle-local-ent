<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sigstore Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: fixed course rail on the left (stacks on top at phone width),
   a reading column on the right. Palette continues the kit's navy + teal
   + amber identity used in the Word reference and deck. */
:root {
  --bg: #f2f5f8;
  --surface: #ffffff;
  --surface-2: #e8eff4;
  --fg: #13213a;
  --muted: #566a80;
  --line: #d3dde6;
  --accent: #0f7c80;
  --accent-ink: #0a5d60;
  --accent-soft: #d6eeee;
  --amber: #b5701a;
  --amber-soft: #fbecd5;
  --ok: #2b7a4b;
  --ok-soft: #dff1e6;
  --bad: #b23d37;
  --bad-soft: #f8e0de;
  --code-bg: #0f1d30;
  --code-fg: #d7e4f2;
  --code-dim: #8fa6bf;
  --node: #ffffff;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1420; --surface: #131f30; --surface-2: #1a2a40; --fg: #e4ecf5; --muted: #9aabbf;
    --line: #2a3c55; --accent: #3db5ad; --accent-ink: #7fd6cf; --accent-soft: #143a3d;
    --amber: #e3a54a; --amber-soft: #3a2b12; --ok: #5cc08b; --ok-soft: #173326; --bad: #e57c74; --bad-soft: #3d1d1b;
    --code-bg: #08111c; --code-fg: #d7e4f2; --code-dim: #8094ab; --node: #182740; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1420; --surface: #131f30; --surface-2: #1a2a40; --fg: #e4ecf5; --muted: #9aabbf;
  --line: #2a3c55; --accent: #3db5ad; --accent-ink: #7fd6cf; --accent-soft: #143a3d;
  --amber: #e3a54a; --amber-soft: #3a2b12; --ok: #5cc08b; --ok-soft: #173326; --bad: #e57c74; --bad-soft: #3d1d1b;
  --code-bg: #08111c; --code-fg: #d7e4f2; --code-dim: #8094ab; --node: #182740; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 17px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4, .ui { font-family: var(--font-ui); }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
code, pre, kbd { font-family: var(--font-mono); }
p code, li code, td code, .inline code { font-size: .86em; background: var(--surface-2); padding: .08em .35em; border-radius: 4px; }
a { color: var(--accent-ink); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }

/* ---------- rail ---------- */
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 22px 18px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; gap: 10px; align-items: center; }
.seal { width: 40px; height: 40px; flex: none; }
.brand h1 { font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; }
.brand p { margin: 0; font-family: var(--font-ui); font-size: .78rem; color: var(--muted); }
.overall { font-family: var(--font-ui); font-size: .82rem; color: var(--muted); display: grid; gap: 6px; }
.bar { height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.nav button { width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 9px 10px; display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; font-family: var(--font-ui); font-size: .9rem; }
.nav button:hover { background: var(--surface-2); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
.nav .num { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: .78rem; font-weight: 700; color: var(--muted); }
.nav .done .num { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.nav .kind { font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.rail-foot { margin-top: auto; font-family: var(--font-ui); font-size: .76rem; color: var(--muted); display: grid; gap: 8px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-ink); text-decoration: underline; font-size: .76rem; justify-self: start; }

/* ---------- main ---------- */
main { padding-block: 34px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 30px; }
.eyebrow { font-family: var(--font-ui); font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--accent-ink); }
.head h2 { font-size: clamp(1.7rem, 3.4vw, 2.35rem); font-weight: 800; letter-spacing: -.02em; margin-top: 6px; }
.head p { color: var(--muted); max-width: 64ch; margin: 10px 0 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { font-family: var(--font-ui); font-size: .76rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.amber { background: var(--amber-soft); color: var(--amber); }
section > h3 { font-size: 1.25rem; font-weight: 750; margin-bottom: 10px; }
.prose { max-width: 66ch; }
.prose p { margin: 0 0 .8em; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.note { border-left: 4px solid var(--amber); background: var(--amber-soft); padding: 12px 16px; border-radius: 0 8px 8px 0; font-size: .95rem; }

/* ---------- flow diagram ---------- */
.flow { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.diagram { overflow-x: auto; }
.diagram svg { width: 100%; min-width: 520px; height: auto; display: block; }
.diagram .node rect { fill: var(--node); stroke: var(--line); stroke-width: 1.5; transition: all .25s; }
.diagram .node text { fill: var(--muted); font-family: var(--font-ui); font-size: 13px; font-weight: 600; transition: fill .25s; }
.diagram .node.on rect { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-soft); }
.diagram .node.on text { fill: var(--accent-ink); }
.diagram .edge { stroke: var(--line); stroke-width: 2; fill: none; transition: stroke .25s; }
.diagram .edge.on { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 7 5; animation: dash 1s linear infinite; }
.diagram .zone { fill: none; stroke: var(--line); stroke-dasharray: 3 4; }
.diagram .zone-label { fill: var(--muted); font-family: var(--font-ui); font-size: 11px; letter-spacing: .08em; }
@keyframes dash { to { stroke-dashoffset: -24; } }
@media (prefers-reduced-motion: reduce) { .diagram .edge.on { animation: none; } .bar > i { transition: none; } }
.steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.steps button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-family: var(--font-ui); font-size: .82rem; font-weight: 600; }
.steps button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.stepcard h4 { font-size: 1.1rem; margin: 0 0 2px; }
.stepcard .tool { font-family: var(--font-ui); font-size: .8rem; color: var(--accent-ink); font-weight: 700; margin-bottom: 8px; }
.stepcard p { margin: 0 0 .7em; }
.stepcard .detail { color: var(--muted); font-size: .94rem; }
.stepnav { display: flex; gap: 8px; margin-top: 10px; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 8px; padding: 8px 16px; font-family: var(--font-ui); font-weight: 700; font-size: .9rem; }
.btn.ghost { background: transparent; color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: default; }

/* ---------- tool explorer ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-family: var(--font-ui); font-size: .84rem; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.search { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-family: var(--font-ui); font-size: .95rem; }
.explorer { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
.toollist { display: grid; gap: 4px; max-height: 560px; overflow-y: auto; padding-right: 4px; }
.toollist button { text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 8px 10px; display: grid; gap: 1px; font-family: var(--font-ui); }
.toollist button:hover { background: var(--surface-2); }
.toollist button[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
.toollist .tname { font-weight: 700; font-size: .92rem; }
.toollist .tgroup { font-size: .74rem; color: var(--muted); }
.tooldetail h4 { font-size: 1.35rem; font-weight: 800; margin: 0; }
.tooldetail .ver { font-family: var(--font-mono); font-size: .8rem; color: var(--accent-ink); margin: 2px 0 12px; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 14px; font-size: .95rem; }
.kv dt { font-family: var(--font-ui); font-size: .76rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; padding-top: 3px; }
.kv dd { margin: 0; min-width: 0; }
.kv dd.breaks { color: var(--bad); }

/* ---------- code ---------- */
.code { position: relative; background: var(--code-bg); color: var(--code-fg); border-radius: 8px; font-size: .82rem; line-height: 1.55; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; white-space: pre; }
.code .copy { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,.08); color: var(--code-fg); border: 1px solid rgba(255,255,255,.18); border-radius: 6px; padding: 2px 9px; font-family: var(--font-ui); font-size: .74rem; }
.code .label { font-family: var(--font-ui); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--code-dim); padding: 10px 16px 0; }
.code.expect { background: var(--surface-2); color: var(--fg); }
.code.expect .label { color: var(--muted); }

/* ---------- labs ---------- */
.lab { display: grid; gap: 14px; }
.labstep { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 10px; }
.labstep.done { border-color: var(--ok); }
.labstep header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.labstep .sn { font-family: var(--font-mono); font-weight: 700; font-size: .85rem; background: var(--surface-2); padding: 2px 8px; border-radius: 6px; }
.labstep h4 { font-size: 1.05rem; margin: 0; flex: 1 1 200px; }
.where { font-family: var(--font-ui); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 6px; }
.where.online { background: var(--amber-soft); color: var(--amber); }
.where.laptop { background: var(--accent-soft); color: var(--accent-ink); }
.check { display: inline-flex; gap: 8px; align-items: center; font-family: var(--font-ui); font-size: .88rem; font-weight: 600; }
.check input { width: 18px; height: 18px; accent-color: var(--ok); }
.labstep .tip { font-size: .92rem; color: var(--muted); margin: 0; }

/* ---------- PKI matcher ---------- */
.trees { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tree h4 { font-family: var(--font-ui); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
.keycard { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; margin-bottom: 8px; }
.keycard .kl { font-family: var(--font-ui); font-weight: 700; font-size: .9rem; }
.keycard select { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-family: var(--font-ui); font-size: .82rem; }
.keycard.right { border-color: var(--ok); background: var(--ok-soft); }
.keycard.wrong { border-color: var(--bad); background: var(--bad-soft); }
.keycard .ki { font-size: .84rem; color: var(--muted); }
.indent { margin-left: 14px; border-left: 2px dashed var(--line); padding-left: 10px; }

/* ---------- rekor explorer + policy anatomy ---------- */
.anatomy { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.yaml { background: var(--code-bg); color: var(--code-fg); border-radius: 8px; padding: 10px 0; font-family: var(--font-mono); font-size: .78rem; overflow-x: auto; }
.yaml button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 1px 14px; white-space: pre; color: inherit; font-family: inherit; font-size: inherit; }
.yaml button.has { cursor: pointer; }
.yaml button.has:hover, .yaml button.sel { background: rgba(61, 181, 173, .22); }
.yaml button:not(.has) { cursor: default; color: var(--code-dim); }
.explain { position: sticky; top: 16px; }
.explain h4 { font-family: var(--font-mono); font-size: .86rem; margin: 0 0 8px; color: var(--accent-ink); word-break: break-all; }

/* ---------- simulator ---------- */
.sim { display: grid; gap: 14px; }
.simform { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; font-family: var(--font-ui); font-size: .82rem; font-weight: 600; color: var(--muted); min-width: 0; }
.field input, .field select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-family: var(--font-mono); font-size: .8rem; }
.field.wide { grid-column: 1 / -1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-family: var(--font-ui); font-size: .84rem; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.results { display: grid; gap: 8px; }
.result { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.verdict { font-family: var(--font-ui); font-weight: 800; font-size: .78rem; text-align: center; border-radius: 6px; padding: 4px 0; letter-spacing: .05em; }
.verdict.admit { background: var(--ok-soft); color: var(--ok); }
.verdict.deny { background: var(--bad-soft); color: var(--bad); }
.verdict.audit { background: var(--amber-soft); color: var(--amber); }
.result .rl { font-family: var(--font-ui); font-weight: 700; font-size: .9rem; }
.result .rs { font-family: var(--font-mono); font-size: .74rem; color: var(--muted); word-break: break-all; }
.result .rr { font-size: .88rem; margin-top: 2px; }

/* ---------- enterprise ---------- */
.zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.zone { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 6px; align-content: start; }
.zone h4 { font-family: var(--font-ui); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-ink); margin: 0 0 4px; }
.zone button { text-align: left; background: var(--surface-2); border: 1px solid transparent; border-radius: 6px; padding: 7px 10px; font-family: var(--font-ui); font-size: .86rem; font-weight: 600; }
.zone button[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }
.zone .zd { font-size: .9rem; color: var(--fg); padding: 2px 4px 6px; }
.trace { counter-reset: t; list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.trace li { counter-increment: t; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; opacity: .38; transition: opacity .3s; }
.trace li.on { opacity: 1; }
.trace li::before { content: counter(t); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-ui); font-weight: 800; font-size: .8rem; background: var(--surface-2); color: var(--muted); }
.trace li.on::before { background: var(--accent); color: var(--surface); }

/* ---------- quiz ---------- */
.quiz { display: grid; gap: 14px; }
.quiz .score { font-family: var(--font-ui); font-weight: 700; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.q legend { font-family: var(--font-ui); font-weight: 700; font-size: 1rem; padding: 0; margin-bottom: 10px; }
.q fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 6px; cursor: pointer; font-size: .95rem; }
.opt input { margin-top: 5px; accent-color: var(--accent); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.incorrect { border-color: var(--bad); background: var(--bad-soft); }
.why { font-size: .92rem; margin-top: 6px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
.why b { font-family: var(--font-ui); }
.drill .symptom { font-family: var(--font-mono); font-size: .86rem; background: var(--code-bg); color: var(--code-fg); padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; }

.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.welcome { display: grid; gap: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.mcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 4px; font-family: var(--font-ui); }
.mcard:hover { border-color: var(--accent); }
.mcard .mn { font-size: .74rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.mcard .mt { font-weight: 800; font-size: 1rem; }
.mcard .ms { font-family: var(--font-body); font-size: .88rem; color: var(--muted); }
.mcard .mst { font-size: .76rem; font-weight: 700; color: var(--ok); }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); }
  .nav { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; padding-bottom: 4px; }
  .nav button { grid-template-columns: 26px auto; }
  .nav .kind { display: none; }
  .rail-foot { display: none; }
  .flow, .explorer, .anatomy { grid-template-columns: 1fr; }
  .trees { grid-template-columns: 1fr; }
  .explain { position: static; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .simform { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  .result { grid-template-columns: 1fr; }
}

/* Grid and flex children that hold code, tables or long identifiers must be
   allowed to shrink; their own containers scroll instead of the page. */
.wrap > *, .lab > *, .labstep > *, .panel > *, .flow > *, .explorer > *, .anatomy > *,
.quiz > *, .q, .tooldetail, .sim > *, .results > *, .zones > * { min-width: 0; }
@media (max-width: 900px) {
  .flow, .explorer, .anatomy, .trees { grid-template-columns: minmax(0, 1fr); }
}
p code, li code, td code, .stepcard, .prose, .zd, .trace span, .rr, .why, .tip, .kv dd, .explain p, .opt span, .q legend { overflow-wrap: anywhere; min-width: 0; }
/* Diagram full width above the step card; programmatic focus on headings
   (for screen readers after navigation) without a visual ring. */

const TOOLS_DATA = {"title": "Sigstore Offline Kit — Tools & Components Reference", "subtitle": "What every tool is, why the kit uses it, and where it appears", "categories": [{"id": "workstation", "name": "Workstation tools", "short": "Run on your laptop", "intro": "Command-line tools you run on the laptop (Linux or WSL2). All except the OS basics are downloaded once by 01-build-offline-bundle.sh into bundle/bin, so nothing is installed from the internet on the offline machine.", "tools": [{"name": "Docker (Engine / Desktop)", "version": "24+ / Desktop 4.30+", "what": "Container runtime that runs Linux containers on your machine.", "why": "Everything runs in containers: the kind Kubernetes node, the offline image mirror, and the TUF repository builder. Docker Desktop provides this on Windows via WSL2.", "where": "02, 04, 10, 12, test/compose", "offline": "Installed beforehand (prerequisite).", "cmd": "docker ps   |   docker load -i bundle/images/host-images.tar"}, {"name": "WSL2 (Windows only)", "version": "Ubuntu 22.04/24.04", "what": "Windows Subsystem for Linux — a real Linux kernel inside Windows.", "why": "All kit scripts are bash. WSL2 gives Windows users the same shell, tools and paths as Linux users, and Docker Desktop integrates with it.", "where": "All scripts on Windows", "offline": "Installed beforehand (prerequisite).", "cmd": "wsl --shutdown   (after editing the hosts file)"}, {"name": "kind", "version": "v0.33.0", "what": "Kubernetes IN Docker — runs a full Kubernetes cluster as Docker containers.", "why": "Gives a real, disposable Kubernetes v1.37 cluster on a laptop, using the same Helm charts as production. Its containerd honours /etc/containerd/certs.d, which is how the cluster pulls images from the offline mirror.", "where": "04-create-cluster.sh, 99-teardown.sh", "offline": "Binary in bundle/bin; node image kindest/node:v1.37.0 in host-images.tar.", "cmd": "kind create cluster --config .generated/kind-config.yaml"}, {"name": "kubectl", "version": "v1.37.0", "what": "The Kubernetes command-line client.", "why": "Creates namespaces and Secrets (keys, TLS), applies manifests, waits for rollouts, reads logs and runs admission dry-runs.", "where": "04–08, 12, 13, verify-stack, backup/restore", "offline": "Binary in bundle/bin.", "cmd": "kubectl --context kind-sigstore get pods -A"}, {"name": "Helm", "version": "v3.16.2", "what": "Package manager for Kubernetes; installs versioned charts with a values file.", "why": "Installs Traefik, Trillian, Rekor, Fulcio, the CT log and Kyverno from the official charts, pinned to tested versions, using the kit's values files.", "where": "05, 08, 13; 01 (helm pull, helm template)", "offline": "Binary in bundle/bin; charts as .tgz in bundle/charts.", "cmd": "helm upgrade --install fulcio bundle/charts/fulcio-2.11.4.tgz -f config/helm/fulcio-values.yaml"}, {"name": "crane", "version": "v0.22.1 (go-containerregistry)", "what": "Daemonless tool for working with container images and registries.", "why": "Builds the offline mirror (crane copy keeps multi-arch digests intact), resolves image digests before signing, pushes the demo image without needing Docker to trust the CA, and lists tags.", "where": "01, 10, 13; CI examples", "offline": "Binary in bundle/bin (+ crane.exe for Windows).", "cmd": "crane digest registry.sigstore.local/demo/hello:v1"}, {"name": "cosign", "version": "v3.1.3", "what": "Sigstore's signing and verification client.", "why": "Performs keyless signing (OIDC login → Fulcio certificate → Rekor entry), verifies signatures, attaches attestations, and generates the private trusted_root.json and signing_config.json.", "where": "09, 10, CI examples, windows/cosign-windows.ps1", "offline": "Binary in bundle/bin (+ cosign.exe for Windows).", "cmd": "cosign verify --trusted-root out/trusted_root.json --certificate-identity alice@sigstore.local ..."}, {"name": "gitsign", "version": "v0.18.0", "what": "Sigstore's keyless signer for git commits and tags; git calls it in place of GPG (gpg.format x509, gpg.x509.program gitsign).", "why": "Proves who wrote each commit with the same Keycloak login, private Fulcio CA and Rekor log as image signing, so there are no GPG or SSH signing keys to manage.", "where": "14-configure-gitsign.sh, export-trust.sh, test/compose/gitsign-test.sh, docs/13", "offline": "Binary in bundle/bin (+ gitsign.exe for Windows), checked against the release checksums.txt.", "cmd": "gitsign verify --certificate-identity alice@sigstore.local --certificate-oidc-issuer https://keycloak.sigstore.local/realms/sigstore HEAD"}, {"name": "jq", "version": "1.7.1", "what": "Command-line JSON processor.", "why": "Reads OIDC tokens, Rekor API responses, trusted roots and Kyverno output inside the scripts.", "where": "07, 09–13, verify-stack, get-token", "offline": "Static binary in bundle/bin.", "cmd": "jq .treeSize  (Rekor log size)"}, {"name": "OpenSSL", "version": "3.x (OS package)", "what": "Cryptography toolkit.", "why": "Generates every key and certificate locally: TLS root and wildcard cert, Fulcio root + intermediate CA, Rekor and CT log signing keys. Also verifies chains and compares key fingerprints.", "where": "03-generate-pki.sh, 08, verify-stack, backup.sh (AES encryption)", "offline": "Ships with Linux / WSL.", "cmd": "openssl verify -CAfile pki/fulcio/root.crt pki/fulcio/intermediate.crt"}, {"name": "curl", "version": "OS package", "what": "HTTP client.", "why": "Health checks against Keycloak, Fulcio, Rekor, registry and TUF over TLS, and fetching OIDC tokens for non-interactive signing.", "where": "Most scripts, get-token.sh", "offline": "Ships with Linux / WSL.", "cmd": "curl --cacert pki/tls/ca.crt https://rekor.sigstore.local/api/v1/log"}, {"name": "bash, perl, coreutils", "version": "OS packages", "what": "Shell and standard Unix utilities (tar, sha256sum, base64, sed, awk).", "why": "bash runs the scripts; perl renders the .tpl templates; sha256sum verifies the bundle; tar/base64 package the TUF repo and backups.", "where": "All scripts (lib.sh render())", "offline": "Ship with Linux / WSL.", "cmd": "sha256sum -c bundle/SHA256SUMS"}, {"name": "PowerShell", "version": "5.1+ (Windows)", "what": "Windows shell.", "why": "Edits the Windows hosts file and imports the TLS root into the Windows certificate store, so browsers, Docker Desktop and cosign.exe trust *.sigstore.local.", "where": "windows/Setup-Hosts.ps1, windows/cosign-windows.ps1", "offline": "Built into Windows.", "cmd": ".\\windows\\Setup-Hosts.ps1  (Administrator)"}]}, {"id": "platform", "name": "Cluster platform", "short": "Plumbing inside Kubernetes", "intro": "Infrastructure the Sigstore services need: networking, DNS, storage, ingress and the image supply. None of it is Sigstore-specific, but each piece solves a concrete offline problem.", "tools": [{"name": "containerd (in the kind node)", "version": "bundled in kindest/node", "what": "The container runtime Kubernetes uses to pull and run images.", "why": "Configured through hosts.toml files to fetch docker.io, ghcr.io, quay.io, gcr.io, registry.k8s.io and reg.kyverno.io images from the local mirror, and to trust the private registry's TLS certificate.", "where": "04-create-cluster.sh (.generated/containerd/certs.d)", "offline": "Part of the node image.", "cmd": "docker exec sigstore-control-plane crictl pull ghcr.io/sigstore/fulcio:v1.9.0"}, {"name": "Offline image mirror (registry:2)", "version": "2.8.3", "what": "A registry container on 127.0.0.1:5000 serving bundle/mirror.", "why": "Replaces the internet for image pulls. Every platform image is stored as <registry>/<repo> with its original digest, so the Helm charts' digest-pinned references work unchanged.", "where": "01 (populate), 02 (start), 04 (attach to kind network)", "offline": "Image in host-images.tar; data in bundle/mirror (≈4.2 GB).", "cmd": "curl http://127.0.0.1:5000/v2/_catalog"}, {"name": "Traefik", "version": "v3.7.14 (chart 42.0.0)", "what": "Kubernetes ingress controller and reverse proxy.", "why": "Single TLS front door for keycloak, fulcio, rekor, registry and tuf .sigstore.local. Pinned to ClusterIP 10.96.100.100 so pods and the node resolve the same names to it. Chosen because ingress-nginx was retired in March 2026.", "where": "05-deploy-ingress.sh, config/helm/traefik-values.yaml", "offline": "Image mirrored; chart in bundle/charts.", "cmd": "kubectl -n traefik logs deploy/traefik"}, {"name": "CoreDNS", "version": "bundled with Kubernetes", "what": "The cluster's DNS server.", "why": "An extra sigstore.local zone answers every *.sigstore.local name with Traefik's IP, so Fulcio can reach Keycloak and Kyverno can reach the registry/TUF through the same TLS endpoints as the laptop.", "where": "05-deploy-ingress.sh, config/coredns/", "offline": "Part of the node image.", "cmd": "kubectl run dnscheck --rm -it --image=busybox -- nslookup keycloak.sigstore.local"}, {"name": "local-path-provisioner", "version": "bundled with kind", "what": "Dynamic storage provisioner backed by node disk.", "why": "Creates the PersistentVolumes for MySQL (transparency logs), the registry, Keycloak and Rekor attestation storage.", "where": "All PVCs", "offline": "Part of the node image.", "cmd": "kubectl get pvc -A"}]}, {"id": "sigstore", "name": "Sigstore services", "short": "The signing infrastructure", "intro": "The core of the stack — private replacements for fulcio.sigstore.dev, rekor.sigstore.dev and the public CT log, all signing with keys you generated.", "tools": [{"name": "Fulcio", "version": "v1.9.0 (chart 2.11.4)", "what": "Sigstore's code-signing certificate authority.", "why": "Turns a verified OIDC identity into a 10-minute X.509 signing certificate, issued by your intermediate CA. Trusts Keycloak through the CACert field and submits every certificate to the CT log.", "where": "08-deploy-sigstore.sh, fulcio-values.yaml, fulcio-config-values.yaml.tpl", "offline": "Image mirrored; CA from pki/fulcio.", "cmd": "curl https://fulcio.sigstore.local/api/v2/configuration"}, {"name": "CT log (ct_server / ctfe)", "version": "scaffolding v0.7.33 (chart 0.2.69)", "what": "Certificate Transparency log front-end.", "why": "Records every certificate Fulcio issues and returns a Signed Certificate Timestamp (SCT) embedded in the cert, so mis-issued certificates are detectable. cosign verifies the SCT.", "where": "08, ctlog-values.yaml (in-cluster only)", "offline": "Image mirrored; key from pki/ctlog.", "cmd": "kubectl -n ctlog-system port-forward svc/ctlog 6962:80"}, {"name": "Rekor", "version": "v1.5.4 (chart 1.8.7)", "what": "Sigstore's transparency log for signatures and attestations.", "why": "Stores a tamper-evident record of every signature and returns an inclusion proof and signed timestamp, proving the signature was made while the short-lived certificate was valid. Uses your file-based signer key.", "where": "08, rekor-values.yaml, 11-inspect-rekor.sh", "offline": "Image mirrored; key from pki/rekor.", "cmd": "curl https://rekor.sigstore.local/api/v1/log"}, {"name": "Trillian (log server + log signer)", "version": "v1.8.0 (chart 0.4.0)", "what": "Google's verifiable append-only Merkle-tree log.", "why": "The storage engine under both Rekor and the CT log. The log server accepts entries and serves proofs; the log signer sequences them into the tree.", "where": "08, trillian-values.yaml", "offline": "Images mirrored.", "cmd": "kubectl -n trillian-system get pods"}, {"name": "MySQL (trillian db_server)", "version": "Trillian CI image", "what": "Relational database.", "why": "Persists Trillian's Merkle trees — the complete transparency history. The most important data to back up.", "where": "08, backup.sh (mysqldump), restore.sh", "offline": "Image mirrored.", "cmd": "mysqldump --databases trillian"}, {"name": "Redis", "version": "pinned digest", "what": "In-memory key/value store.", "why": "Rekor's search index (artifact hash → entry UUID). Rebuildable from the log, so not backed up.", "where": "rekor chart", "offline": "Image mirrored.", "cmd": "curl -d '{\"hash\":\"sha256:...\"}' .../api/v1/index/retrieve"}]}, {"id": "identity", "name": "Identity, trust & storage", "short": "Who signs, what to trust, where artifacts live", "intro": "The pieces that decide who may sign, how every client learns which keys to trust, and where signed images and their signatures are stored.", "tools": [{"name": "Keycloak", "version": "26.8.1", "what": "Open-source OpenID Connect identity provider.", "why": "Private replacement for Google/GitHub/Microsoft login. Issues the OIDC tokens Fulcio exchanges for certificates: browser, device-code and password flows for people (alice@sigstore.local), client_credentials for CI (ci@sigstore.local).", "where": "07-deploy-keycloak.sh, realm-sigstore.json.tpl, get-token.sh", "offline": "Image mirrored; realm imported from a Secret.", "cmd": "scripts/get-token.sh user"}, {"name": "Private OCI registry (registry:2)", "version": "2.8.3", "what": "CNCF Distribution container registry.", "why": "Stores your images and, next to them, the Sigstore signature and attestation bundles. Served at https://registry.sigstore.local behind Traefik TLS.", "where": "06-deploy-registry.sh, registry.yaml.tpl", "offline": "Image mirrored.", "cmd": "crane catalog registry.sigstore.local"}, {"name": "TUF repository (scaffolding server)", "version": "v0.7.39", "what": "The Update Framework — signed metadata for distributing trust files.", "why": "Distributes trusted_root.json and signing_config securely and supports rotation. Clients pin one root.json; Kyverno 1.19 requires a TUF source to verify keyless signatures offline.", "where": "12-publish-tuf.sh, config/tuf/tuf.yaml.tpl", "offline": "Builder image in host-images.tar; server image mirrored.", "cmd": "cosign initialize --mirror https://tuf.sigstore.local --root out/tuf/root.json"}, {"name": "Private PKI (generated)", "version": "OpenSSL profiles", "what": "Two separate certificate hierarchies plus log keys.", "why": "TLS root + wildcard cert protect transport; Fulcio root (offline) + intermediate (EKU codeSigning) anchor code signing; Rekor and CT keys sign log evidence. Separate hierarchies so one compromise doesn't imply the other.", "where": "03-generate-pki.sh, config/pki/extensions.cnf", "offline": "Generated locally.", "cmd": "openssl x509 -in pki/fulcio/intermediate.crt -noout -ext extendedKeyUsage"}]}, {"id": "policy", "name": "Policy enforcement", "short": "Stop unsigned images", "intro": "Admission controllers that check images before Kubernetes runs them.", "tools": [{"name": "Kyverno", "version": "v1.19.1 (chart 3.9.1)", "what": "Kubernetes-native policy engine.", "why": "Its ImageValidatingPolicy verifies every Pod image from registry.sigstore.local carries a keyless signature from your Fulcio/Rekor with an allowed identity, using trust from the private TUF mirror. Tested: signed admitted, unsigned denied.", "where": "13-deploy-policy.sh, kyverno-values.yaml, policies/kyverno/", "offline": "Images mirrored (reg.kyverno.io).", "cmd": "kubectl get imagevalidatingpolicy"}, {"name": "OPA Gatekeeper (optional)", "version": "v3.23.1", "what": "Policy engine using the Rego language.", "why": "Cannot verify cosign signatures itself; the kit uses it to require images from the private registry pinned by digest, alongside Kyverno.", "where": "config/policies/gatekeeper/", "offline": "Install from your own mirror if used.", "cmd": "kubectl apply -f require-digest-from-private-registry.yaml"}, {"name": "Sigstore policy-controller (reference)", "version": "—", "what": "Sigstore's own admission controller.", "why": "Alternative to Kyverno using TrustRoot + ClusterImagePolicy. Provided as an untested reference.", "where": "config/policies/policy-controller/", "offline": "Not in the bundle.", "cmd": "—"}]}, {"id": "helpers", "name": "Helper container images", "short": "Short-lived jobs and utilities", "intro": "Small images the charts and scripts run once or in init containers. They appear in bundle/images.txt and you may see them in kubectl get pods.", "tools": [{"name": "scaffolding createdb", "version": "v0.7.33", "what": "Kubernetes Job image.", "why": "Creates the trillian database schema in MySQL on first install.", "where": "trillian chart", "offline": "Mirrored.", "cmd": "kubectl -n trillian-system logs job/trillian-createdb"}, {"name": "scaffolding createtree", "version": "v0.7.33", "what": "Kubernetes Job image.", "why": "Creates a Trillian tree for Rekor and for the CT log and stores its ID in a ConfigMap (rekor-config / ctlog-config). Skips if an ID already exists — which is what makes restore work.", "where": "rekor and ctlog charts", "offline": "Mirrored.", "cmd": "kubectl -n rekor-system get cm rekor-config -o yaml"}, {"name": "scaffolding createctconfig", "version": "v0.7.33", "what": "Kubernetes Job image.", "why": "Builds the CT log configuration: fetches Fulcio's root, loads your CT key from Secret ctlog-signer, writes Secret ctlog-secret.", "where": "ctlog chart", "offline": "Mirrored.", "cmd": "kubectl -n ctlog-system logs job/ctlog-createctconfig"}, {"name": "curlimages/curl", "version": "8.17.0", "what": "Tiny image containing curl.", "why": "Init containers that wait for Trillian / Fulcio to answer before Rekor and the CT config job start.", "where": "rekor and ctlog charts", "offline": "Mirrored.", "cmd": "—"}, {"name": "busybox", "version": "1.37 / pinned digest", "what": "Minimal Linux userland in one image.", "why": "Trillian init containers, the TUF unpack init container, DNS check pods, the Keycloak restore pod, and the demo app's base image.", "where": "trillian chart, tuf.yaml.tpl, 05, restore.sh, examples/demo-app", "offline": "Mirrored + host-images.tar.", "cmd": "—"}, {"name": "Kyverno helper images", "version": "v1.19.1", "what": "kyvernopre, kyverno-cli, readiness-checker.", "why": "Pre-start cleanup, CLI used by chart hooks, and readiness checks for the Kyverno install.", "where": "kyverno chart", "offline": "Mirrored.", "cmd": "—"}]}, {"id": "testing", "name": "Build & test tools", "short": "Used to validate the kit", "intro": "Not needed to run the stack. Used to prove the kit works (test/compose/run.sh) and to lint it. Useful if you change the kit.", "tools": [{"name": "Docker Compose", "version": "v2 (Docker plugin)", "what": "Runs multi-container apps from one YAML file.", "why": "Runs the same Sigstore images and arguments as the charts, without Kubernetes, for the end-to-end offline integration test.", "where": "test/compose/docker-compose.yml", "offline": "Ships with Docker.", "cmd": "test/compose/run.sh"}, {"name": "nginx (test gateway)", "version": "1.27", "what": "Web server / reverse proxy.", "why": "Stands in for Traefik in the Docker test: TLS termination and the *.sigstore.local names.", "where": "test/compose/nginx.conf", "offline": "Test only.", "cmd": "—"}, {"name": "Toolbox image (buildpack-deps)", "version": "bookworm-curl", "what": "Debian image with bash, curl, openssl.", "why": "A stand-in laptop on an --internal network with no internet, proving every client step works air-gapped.", "where": "test/compose/run.sh", "offline": "Test only.", "cmd": "—"}, {"name": "createtree (Trillian CLI)", "version": "v1.7.2", "what": "Trillian admin client.", "why": "Creates Trillian trees in the Docker test (in Kubernetes the createtree Job does it).", "where": "test/compose/run.sh", "offline": "Build with go install.", "cmd": "createtree --admin_server=127.0.0.1:18091"}, {"name": "Kyverno CLI", "version": "v1.19.1", "what": "Offline Kyverno policy evaluator.", "why": "Proved the ImageValidatingPolicy admits signed and denies unsigned images, against the live registry and TUF.", "where": "test/compose/run.sh (optional)", "offline": "Optional download.", "cmd": "kyverno apply policy.yaml --resource pods.yaml"}, {"name": "gator", "version": "v3.23.1", "what": "Gatekeeper's CLI test tool.", "why": "Validated the Gatekeeper digest/registry constraint.", "where": "docs/11 test report", "offline": "Optional.", "cmd": "gator test -f template.yaml -f pods.yaml"}, {"name": "shellcheck", "version": "v0.10.0", "what": "Static analyser for shell scripts.", "why": "Linted every script for bugs.", "where": "Development", "offline": "Optional.", "cmd": "shellcheck -x scripts/*.sh"}, {"name": "kubeconform", "version": "v0.6.7", "what": "Kubernetes manifest schema validator.", "why": "Validated the registry, Keycloak and TUF manifests against the Kubernetes API schema.", "where": "Development", "offline": "Optional.", "cmd": "kubeconform -strict file.yaml"}]}], "scripts": [["00-check-prereqs.sh", "Checks Docker resources, ports, kernel limits, bundled tools and hosts entries."], ["01-build-offline-bundle.sh", "ONLINE ONLY. Downloads tools and charts, mirrors all 25 images with digests, saves host images, writes checksums."], ["02-load-offline-bundle.sh", "Verifies checksums, loads host images, starts the local image mirror."], ["03-generate-pki.sh", "Generates all keys, certificates and random passwords into pki/."], ["04-create-cluster.sh", "Creates the kind cluster wired to the mirror and private registry."], ["05-deploy-ingress.sh", "Installs Traefik, TLS secrets and the CoreDNS *.sigstore.local zone."], ["06-deploy-registry.sh", "Deploys the private OCI registry."], ["07-deploy-keycloak.sh", "Deploys Keycloak, imports the realm, smoke-tests a token."], ["08-deploy-sigstore.sh", "Installs Trillian, Rekor, Fulcio and the CT log; verifies they use your keys."], ["09-configure-cosign.sh", "Creates trusted_root.json, signing_config.json, CA bundle, cosign.env."], ["10-sign-and-verify.sh", "Builds, pushes, keyless-signs and verifies the demo image."], ["11-inspect-rekor.sh", "Shows the Rekor log state and recent entries with signer certificates."], ["12-publish-tuf.sh", "Builds and serves the private TUF trust mirror."], ["13-deploy-policy.sh", "Installs Kyverno and the signature policy; tests admit/deny."], ["install-all.sh", "Runs the whole offline install in order."], ["verify-stack.sh", "PASS/FAIL health report for every component."], ["get-token.sh", "Fetches an OIDC token (user or CI) for non-interactive signing."], ["setup-hosts.sh", "Adds *.sigstore.local to /etc/hosts and optionally trusts the TLS root."], ["fix-node-dns.sh", "Re-adds node DNS entries after a reboot."], ["backup.sh / restore.sh", "Encrypted backup of keys + log database; full rebuild with history."], ["99-teardown.sh", "Deletes the cluster (and with --purge, the trust root)."]], "files": [["pki/", "All private keys, certificates and passwords. Never commit; back up encrypted."], ["out/trusted_root.json", "What to trust: Fulcio CA chain, Rekor key, CT log key."], ["out/signing_config.json", "Where to sign: Fulcio, Rekor and OIDC URLs."], ["out/tuf/root.json", "TUF bootstrap root distributed to clients and Kyverno."], ["out/cosign.env", "Shell environment for cosign (CA bundle and trust file paths)."], ["bundle/", "Offline bundle: tools, charts, image mirror, host images (≈5.1 GB)."], ["config/env.sh", "All names, IPs and pinned versions in one place."]], "flow": [["Login", "Keycloak", "Developer or CI gets an OIDC token"], ["Certify", "Fulcio", "Token → 10-minute certificate"], ["Witness", "CT log + Trillian", "Certificate logged, SCT returned"], ["Sign", "cosign", "Image digest signed with ephemeral key"], ["Record", "Rekor + Trillian", "Signature logged, inclusion proof returned"], ["Store", "Registry", "Bundle attached next to the image"], ["Enforce", "Kyverno + TUF", "Only signed images admitted"]]};

/* ---------------- Module 1: signing flow ---------------- */
const FLOW_STEPS = [
  { title: "Log in", tool: "Keycloak", nodes: ["dev", "keycloak"], edges: ["e-login"],
    body: "cosign opens a browser login (or a device code, or uses a CI token). Keycloak returns an OIDC ID token with <code>iss</code> = <code>https://keycloak.sigstore.local/realms/sigstore</code>, <code>aud</code> = <code>sigstore</code>, and a verified e-mail. In CI the token comes from the pipeline instead.",
    detail: "Fulcio only trusts the token because its issuer is listed in Fulcio's configuration, and Keycloak's HTTPS certificate chains to the TLS root given to Fulcio as <code>CACert</code>." },
  { title: "Make a throw-away key", tool: "cosign", nodes: ["dev"], edges: [],

    REKOR_FIELDS.forEach(([k, val, why], i) => {
      const b = el(`<button type="button" class="has">  "${esc(k)}": ${esc(val)}${i < REKOR_FIELDS.length - 1 ? "," : ""}</button>`);
      b.addEventListener("click", () => { box.querySelectorAll(".sel").forEach((x) => x.classList.remove("sel")); b.classList.add("sel"); ex.innerHTML = `<h4>${esc(k)}</h4><p>${esc(why)}</p>`; });
      box.appendChild(b);
    });
    box.appendChild(el(`<button type="button" tabindex="-1">}</button>`));
    v.appendChild(quiz("sign", QUIZ.sign, "Check your understanding"));
    v.appendChild(el(pager("sign")));
  };

  /* ---- Module 6 ---- */
  RENDER.gitsign = (v) => {
    const m = MODULES.find((x) => x.id === "gitsign");
    v.appendChild(el(header(m)));
    v.appendChild(el(`<section class="prose"><h3>Same login, same CA, for your commits</h3>
      <p>cosign signs images; <b>gitsign</b> signs git commits and tags with the same keyless flow. git calls gitsign instead of GPG, gitsign gets a 10-minute certificate from your private Fulcio after a Keycloak login, signs the commit with a throw-away key, and records it in your private Rekor. There is no key to create, store or revoke.</p>
      <p>The stack from module 4 must be running and the TUF mirror published. Work from the kit folder.</p></section>`));
    v.appendChild(labSteps(GITSIGN_STEPS));
    v.appendChild(el(`<div class="note">In the enterprise design (enterprise/docs/11-gitsign.md) engineers sign through the Keycloak <code>staff</code> realm brokered from Entra ID or AD FS, and <code>verify-commits.yml</code> runs on every pull request, required by an organisation ruleset ("Require workflows to pass before merging", pinned to a central copy), so a pull request cannot edit the check away. GitHub's own badge stays "Unverified" because it only trusts public CAs.</div>`));
    v.appendChild(quiz("gitsign", QUIZ.gitsign, "Check your understanding"));
    v.appendChild(el(pager("gitsign")));
  };

  /* ---- Module 7 ---- */
  RENDER.policy = (v) => {
    const m = MODULES.find((x) => x.id === "policy");
    v.appendChild(el(header(m)));
    const an = el(`<section><h3>Anatomy of the policy</h3><div class="anatomy"><div class="yaml" role="group" aria-label="Kyverno policy lines"></div>
      <div class="panel explain" aria-live="polite"><h4>Click a highlighted line</h4><p>Every line that changes behaviour has an explanation.</p></div></div></section>`);
    v.appendChild(an);
    const yb = $(".yaml", an), ex = $(".explain", an);
    POLICY_LINES.forEach(([line, why]) => {
      const b = el(`<button type="button" class="${why ? "has" : ""}" ${why ? "" : 'tabindex="-1"'}></button>`); b.textContent = line;
      if (why) b.addEventListener("click", () => { yb.querySelectorAll(".sel").forEach((x) => x.classList.remove("sel")); b.classList.add("sel"); ex.innerHTML = `<h4>${esc(line.trim())}</h4><p>${esc(why)}</p>`; });
      yb.appendChild(b);
    });

    const sim = el(`<section class="sim"><h3>Policy simulator</h3>
      <p class="prose" style="color:var(--muted);margin:0">Seven images with real certificate identities. Change the policy and watch admission decisions change. Switch to OpenShift's native check to see why the enterprise design keeps Kyverno on OpenShift.</p>
      <div class="panel" style="display:grid;gap:14px">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg" role="group" aria-label="Enforcer"><button type="button" data-mode="kyverno" aria-pressed="true">Kyverno</button><button type="button" data-mode="openshift" aria-pressed="false">OpenShift native</button></div>
          <span class="ui" style="font-size:.82rem;color:var(--muted)">Presets:</span><button class="btn ghost" type="button" data-preset="enterprise">GitHub workflows</button><button class="btn ghost" type="button" data-preset="lab">Laptop lab</button></div>
        <div class="simform" id="kyvform">
          <label class="field wide">Issuer (exact match)<input id="sim-issuer" type="text" spellcheck="false"></label>
          <label class="field wide">subjectRegExp<input id="sim-regex" type="text" spellcheck="false"></label>
          <div class="field">Validation action<div class="seg" role="group" aria-label="Validation action"><button type="button" data-act="Deny" aria-pressed="true">Deny</button><button type="button" data-act="Audit" aria-pressed="false">Audit</button></div></div>
          <div class="field" id="regexerr" style="color:var(--bad)" aria-live="polite"></div>
        </div>
        <div class="simform" id="osform" hidden>
          <label class="field wide">fulcioSubject.oidcIssuer<input id="sim-osissuer" type="text" spellcheck="false"></label>
          <label class="field wide">fulcioSubject.signedEmail<input id="sim-email" type="text" spellcheck="false"></label>
        </div>
      </div><div class="results" aria-live="polite"></div></section>`);
    v.appendChild(sim);
    let mode = "kyverno", act = "Deny";
    const iss = $("#sim-issuer", sim), rx = $("#sim-regex", sim), osi = $("#sim-osissuer", sim), em = $("#sim-email", sim);
    iss.value = SIM_PRESETS.enterprise.issuer; rx.value = SIM_PRESETS.enterprise.regex;
    osi.value = SIM_PRESETS.openshift.issuer; em.value = SIM_PRESETS.openshift.email;
    sim.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { mode = b.dataset.mode; sim.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); $("#kyvform", sim).hidden = mode !== "kyverno"; $("#osform", sim).hidden = mode !== "openshift"; run(); }));
    sim.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => { act = b.dataset.act; sim.querySelectorAll("[data-act]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); run(); }));
    sim.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => { const p = SIM_PRESETS[b.dataset.preset]; iss.value = p.issuer; rx.value = p.regex; if (mode !== "kyverno") sim.querySelector('[data-mode="kyverno"]').click(); else run(); }));
    [iss, rx, osi, em].forEach((i) => i.addEventListener("input", run));
    function run() {
      const out = $(".results", sim); out.innerHTML = "";
      let re = null; $("#regexerr", sim).textContent = "";
      if (mode === "kyverno") { try { re = new RegExp(rx.value); } catch (e) { $("#regexerr", sim).textContent = "That regular expression does not parse: " + e.message; return; } }
      SIM_IMAGES.forEach((img) => {
        let ok, reason;
        if (img.never) { ok = false; reason = img.never; }
        else if (mode === "kyverno") {
          if (!img.signed) { ok = false; reason = "No signatures found for this digest."; }
          else if (img.issuer !== iss.value.trim()) { ok = false; reason = `Issuer mismatch: the certificate says ${img.issuer}.`; }
          else if (!re.test(img.san)) { ok = false; reason = "The certificate identity does not match subjectRegExp."; }
          else { ok = true; reason = "Chain, SCT and Rekor proof verified; identity and issuer match."; }
        } else {
          if (!img.signed) { ok = false; reason = "No signatures found."; }
          else if (img.format === "bundle") { ok = false; reason = "CRI-O looks for a sha256-<digest>.sig tag and finds none: cosign v3 stores bundles as OCI referrers."; }
          else if (img.sanType !== "email") { ok = false; reason = "The certificate has a URI identity; the native policy can match only signedEmail."; }
          else if (img.issuer !== osi.value.trim()) { ok = false; reason = `oidcIssuer mismatch: the certificate says ${img.issuer}.`; }
          else if (img.san !== em.value.trim()) { ok = false; reason = "signedEmail does not exactly match the certificate's e-mail."; }
          else { ok = true; reason = "Legacy signature found; e-mail and issuer match exactly."; }
        }
        const verdict = ok ? "admit" : img.never ? "deny" : mode === "kyverno" && act === "Audit" ? "audit" : "deny";
        const label = img.never ? "NO IMAGE" : verdict === "admit" ? "ADMIT" : verdict === "audit" ? "AUDIT" : "DENY";
        const r = el(`<div class="result"><span class="verdict ${verdict}">${label}</span><div><div class="rl">${esc(img.label)}</div><div class="rs">${img.signed ? esc(img.san) : img.never ? "would carry " + esc(img.san) : "no certificate"}</div><div class="rr">${esc(reason)}${verdict === "audit" ? " Admitted, and reported as a policy violation." : ""}</div></div></div>`);
        out.appendChild(r);
      });
    }
    run();
    v.appendChild(el(`<div class="note">OpenShift's native <code>ClusterImagePolicy</code> was checked against the openshift/api and containers/container-libs source in October 2026: <code>fulcioSubject</code> has only <code>oidcIssuer</code> and <code>signedEmail</code>, and CRI-O fetches signatures from the <code>sha256-&lt;digest&gt;.sig</code> tag. Use it as an extra layer for e-mail-signed images that are also signed in the legacy format, not as the main control.</div>`));
    v.appendChild(quiz("policy", QUIZ.policy, "Check your understanding"));
    v.appendChild(el(pager("policy")));
  };

  /* ---- Module 8 ---- */
  RENDER.enterprise = (v) => {
    const m = MODULES.find((x) => x.id === "enterprise");
    v.appendChild(el(header(m)));
    v.appendChild(el(`<section class="prose"><h3>Same design, production custody</h3>
      <p>The laptop and production run the same services with the same trust model. Production changes three things: who holds the keys (AWS KMS, with your corporate root anchoring the chain), who signs (GitHub workflow identities and federated staff logins), and where verification happens (every cluster in every cloud, from a replicated trust root).</p></section>`));
    const zs = el(`<section><h3>Explore the platform</h3><div class="zones"></div></section>`);
    v.appendChild(zs);
    ENT_ZONES.forEach((z) => {
      const zone = el(`<div class="zone"><h4>${esc(z.title)}</h4></div>`);
      z.items.forEach(([t, d]) => {
        const b = el(`<button type="button" aria-expanded="false">${esc(t)}</button>`); const p = el(`<div class="zd" hidden>${esc(d)}</div>`);
        b.addEventListener("click", () => { const open = b.getAttribute("aria-expanded") === "true"; b.setAttribute("aria-expanded", String(!open)); p.hidden = open; });
        zone.appendChild(b); zone.appendChild(p);
      });
      $(".zones", zs).appendChild(zone);
    });
    const tr = el(`<section><h3>Trace one release to production</h3><div class="panel"><ol class="trace"></ol><div class="stepnav"><button class="btn ghost" type="button" id="trprev">Back</button><button class="btn" type="button" id="trnext">Next</button></div></div></section>`);
    v.appendChild(tr);
    const ol = $(".trace", tr); let k = 0;
    TRACE.forEach((t) => ol.appendChild(el(`<li><span>${esc(t)}</span></li>`)));
    function trace() { ol.querySelectorAll("li").forEach((li, i) => li.classList.toggle("on", i <= k)); $("#trprev", tr).disabled = k === 0; $("#trnext", tr).disabled = k === TRACE.length - 1; }
    $("#trprev", tr).addEventListener("click", () => { k = Math.max(0, k - 1); trace(); });
    $("#trnext", tr).addEventListener("click", () => { k = Math.min(TRACE.length - 1, k + 1); trace(); });
    trace();
    v.appendChild(quiz("enterprise", QUIZ.enterprise, "Check your understanding"));
    v.appendChild(el(pager("enterprise")));
  };

  /* ---- Module 9 ---- */
  RENDER.trouble = (v) => {
    const m = MODULES.find((x) => x.id === "trouble");
    v.appendChild(el(header(m)));
    v.appendChild(el(`<section class="prose"><p>Each drill is a real symptom from building and testing this kit. Pick the most likely cause to see the fix. The full list is in <code>docs/08-troubleshooting.md</code>.</p></section>`));
    v.appendChild(quiz("trouble", DRILLS, "Six drills", true));
    v.appendChild(el(pager("trouble")));
  };

  /* ---------- start ---------- */
  const fromHash = (location.hash || "").replace(/^#/, "");
  go(MODULES.some((m) => m.id === fromHash) ? fromHash : state.last || "home");
})();

</script>
</body>
</html>
