# On-prem Kubernetes: Harbor robot account pull secret in the kyverno namespace.
# Render: kustomize build enterprise/consumers/onprem
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../policies/kyverno
patches:
  - target:
      kind: ImageValidatingPolicy
      name: baseline-signed-by-central-workflow
    patch: |-
      - op: replace
        path: /spec/attestors/0/cosign/tuf/mirror
        value: https://tuf-onprem.sigstore.corp.example
      - op: replace
        path: /spec/matchImageReferences
        value:
          - glob: "harbor.corp.example/*"
      - op: replace
        path: /spec/credentials
        value:
          secrets: [registry-pull]
  - target:
      kind: ImageValidatingPolicy
      name: third-party-imported-only
    patch: |-
      - op: replace
        path: /spec/attestors/0/cosign/tuf/mirror
        value: https://tuf-onprem.sigstore.corp.example
      - op: replace
        path: /spec/matchImageReferences
        value:
          - glob: "harbor.corp.example/vendor/*"
      - op: replace
        path: /spec/credentials
        value:
          secrets: [registry-pull]
  - target:
      kind: ImageValidatingPolicy
      name: staff-signed-optin
    patch: |-
      - op: replace
        path: /spec/attestors/0/cosign/tuf/mirror
        value: https://tuf-onprem.sigstore.corp.example
      - op: replace
        path: /spec/matchImageReferences
        value:
          - glob: "harbor.corp.example/*"
      - op: replace
        path: /spec/credentials
        value:
          secrets: [registry-pull]
  - target:
      kind: ValidatingPolicy
      name: allowed-registries
    patch: |-
      - op: replace
        path: /spec/variables/1/expression
        value: "['harbor.corp.example/']"
