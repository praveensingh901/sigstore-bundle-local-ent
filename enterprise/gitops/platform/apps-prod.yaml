# Argo CD Applications for the Sigstore platform cluster (prod).
# Sync waves: controllers (-3, -2) -> namespaces, secrets, issuers, network
# policies (-1) -> Keycloak operator (0) -> Trillian (1) -> Keycloak, TUF
# mirror, rekor-monitor (2) -> Fulcio, Rekor, TSA (3) -> CT log (4; its config
# Job fetches Fulcio's root).
# Bootstrap once: kubectl apply -f enterprise/gitops/platform/project.yaml -f enterprise/gitops/platform/apps-prod.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: sigstore-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
    # Chart mirrored into the platform ECR (OCI) and verified before use.
    # Upstream: https://aws.github.io/eks-charts
    - repoURL: 222222222222.dkr.ecr.me-central-1.amazonaws.com/charts
      chart: aws-load-balancer-controller
      targetRevision: 3.6.1
      helm:
        releaseName: aws-load-balancer-controller
        valueFiles:
          - $values/enterprise/helm/values/common/aws-load-balancer-controller.yaml
          - $values/enterprise/helm/values/prod/aws-load-balancer-controller.yaml
    - repoURL: https://github.com/example-bank/sigstore-platform.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
---
