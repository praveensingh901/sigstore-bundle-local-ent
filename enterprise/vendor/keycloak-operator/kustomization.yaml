# Keycloak Operator 26.8.1, vendored from github.com/keycloak/keycloak-k8s-resources
# (tag 26.8.1, kubernetes/). Images point at the platform ECR mirror.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - keycloaks.k8s.keycloak.org-v1.yml
  - keycloakrealmimports.k8s.keycloak.org-v1.yml
  - kubernetes.yml
images:
  - name: quay.io/keycloak/keycloak-operator
    newName: 222222222222.dkr.ecr.me-central-1.amazonaws.com/mirror/quay.io/keycloak/keycloak-operator
patches:
  # The Keycloak CR sets spec.image explicitly; this keeps the operator's
  # default pointing at the mirror too.
  - target: { kind: Deployment, name: keycloak-operator }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: 222222222222.dkr.ecr.me-central-1.amazonaws.com/mirror/quay.io/keycloak/keycloak:26.8.1
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: 222222222222.dkr.ecr.me-central-1.amazonaws.com/mirror/quay.io/keycloak/keycloak:26.8.1
