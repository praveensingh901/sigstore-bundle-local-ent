# External Secrets Operator 2.14.0: database credentials and the CT log key
# from AWS Secrets Manager. Nothing secret is in Git.
#
#   sigstore-prod/app/trillian-db     {"username","password"}       (created by runbook 10 §4.3)
#   sigstore-prod/app/rekor-index-db  {"username","password"}
#   sigstore-prod/app/keycloak-db     {"username","password"}
#   sigstore-prod/app/keycloak-idp    {"entra-tenant-id","entra-client-id","entra-client-secret","adfs-client-secret"}
#   sigstore-prod/app/keycloak-ci-clients {"jenkins-prod","platform-release"}   (client secrets, realm "ci")
#   sigstore-prod/ctlog/private-key   {"private","password"}        (ceremony, 02 §6)
#
# The general store uses the ESO controller's IRSA role (sigstore-prod-eso),
# which can read only the app/ prefix. The CT key has its own SecretStore in
# ctlog-system that authenticates as ServiceAccount ctlog-secret-reader
# (IRSA role sigstore-prod-ctlog): the only principal whose KMS key policy
# allows decrypting that secret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: me-central-1
  conditions:
    - namespaces: [trillian-system, rekor-system, keycloak]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trillian-db
  namespace: trillian-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: trillian-db
    template:
      data:
        mysql-user: "{{ .username }}"
        mysql-password: "{{ .password }}"
        mysql-database: trillian
  dataFrom:
    - extract:
        key: sigstore-prod/app/trillian-db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rekor-index-db
  namespace: rekor-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: rekor-index-db
    template:
      data:
        mysql-user: "{{ .username }}"
        mysql-password: "{{ .password }}"
        mysql-database: rekor_index
  dataFrom:
    - extract:
        key: sigstore-prod/app/rekor-index-db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-db
  dataFrom:
    - extract:
        key: sigstore-prod/app/keycloak-db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-idp
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-idp          # placeholders in KeycloakRealmImport "staff"
  dataFrom:
    - extract:
        key: sigstore-prod/app/keycloak-idp
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-ci-clients
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-ci-clients    # placeholders in KeycloakRealmImport "ci"
  dataFrom:
    - extract:
        key: sigstore-prod/app/keycloak-ci-clients
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ctlog-secret-reader
  namespace: ctlog-system
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::222222222222:role/sigstore-prod-ctlog
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ctlog-key
  namespace: ctlog-system
spec:
  provider:
    aws:
      service: SecretsManager
      region: me-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: ctlog-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ctlog-signer
  namespace: ctlog-system
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: SecretStore
    name: ctlog-key
  target:
    name: ctlog-signer          # read by the chart's createctconfig Job
  dataFrom:
    - extract:
        key: sigstore-prod/ctlog/private-key
