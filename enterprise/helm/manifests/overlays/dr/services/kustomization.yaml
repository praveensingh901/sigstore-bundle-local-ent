# DR (me-south-1) services: Keycloak (scaled to 0 until failover), TUF mirror, monitor.
# Images come from the ECR replica in me-south-1 (ECR cross-Region replication).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../keycloak
  - ../../../tuf
  - ../../../monitor
images:
  - name: 222222222222.dkr.ecr.me-central-1.amazonaws.com/mirror/amazon/aws-cli
    newName: 222222222222.dkr.ecr.me-south-1.amazonaws.com/mirror/amazon/aws-cli
  - name: 222222222222.dkr.ecr.me-central-1.amazonaws.com/mirror/nginxinc/nginx-unprivileged
    newName: 222222222222.dkr.ecr.me-south-1.amazonaws.com/mirror/nginxinc/nginx-unprivileged
  - name: 222222222222.dkr.ecr.me-central-1.amazonaws.com/sigstore/rekor-monitor
    newName: 222222222222.dkr.ecr.me-south-1.amazonaws.com/sigstore/rekor-monitor
patches:
  - target: { kind: Keycloak, name: keycloak }
    patch: |-
      - { op: replace, path: /spec/instances, value: 0 }
      - { op: replace, path: /spec/image, value: "222222222222.dkr.ecr.me-south-1.amazonaws.com/mirror/quay.io/keycloak/keycloak:26.8.1" }
      - { op: replace, path: /spec/db/host, value: sigstore-dr-postgresql.cluster-REPLACE.me-south-1.rds.amazonaws.com }
  - target: { kind: Deployment, name: tuf-server }
    patch: |-
      - { op: replace, path: /spec/template/spec/initContainers/0/env/1/value, value: example-bank-sigstore-tuf-dr }
      - { op: replace, path: /spec/template/spec/containers/0/env/1/value, value: example-bank-sigstore-tuf-dr }
  - target: { kind: Deployment, name: rekor-monitor }   # Rekor runs 0 replicas until failover
    patch: |-
      - { op: replace, path: /spec/replicas, value: 0 }
  - target: { kind: ServiceAccount, name: tuf-server }
    patch: |-
      - { op: replace, path: /metadata/annotations/eks.amazonaws.com~1role-arn, value: "arn:aws:iam::222222222222:role/sigstore-dr-tuf" }
  - target: { kind: Ingress, name: keycloak }
    patch: |-
      - { op: replace, path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn, value: "arn:aws:acm:me-south-1:222222222222:certificate/REPLACE" }
      - { op: replace, path: /metadata/annotations/alb.ingress.kubernetes.io~1security-groups, value: sg-REPLACE-dr-signing }
  - target: { kind: Ingress, name: tuf }
    patch: |-
      - { op: replace, path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn, value: "arn:aws:acm:me-south-1:222222222222:certificate/REPLACE" }
      - { op: replace, path: /metadata/annotations/alb.ingress.kubernetes.io~1security-groups, value: sg-REPLACE-dr-trust }
