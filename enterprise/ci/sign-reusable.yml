# Deployed as example-bank/platform-workflows/.github/workflows/sign.yml
# The ONLY workflow allowed to sign production images (06-ci-github.md §2).
# Fulcio puts this file's job_workflow_ref in the certificate SAN:
#   https://github.com/example-bank/platform-workflows/.github/workflows/sign.yml@refs/heads/main
# and the calling repository in githubWorkflowRepository / source-repository-*.
name: sign
on:
  workflow_call:
    inputs:
      image:
        description: Registry and repository, without tag (e.g. 333333333333.dkr.ecr.me-central-1.amazonaws.com/payments/api)
        required: true
        type: string
      digest:
        description: Image digest (sha256:...)
        required: true
        type: string
      sbom-artifact:
        description: Name of an uploaded workflow artifact containing sbom.spdx.json (optional)
        required: false
        type: string
        default: ""
      aws-role-arn:
        description: Role that can push signature bundles to the image's ECR repository
        required: true
        type: string

permissions: {}

jobs:
  sign:
    runs-on: [self-hosted, sigstore-signing]
    timeout-minutes: 10
    permissions:
      id-token: write          # cosign requests the OIDC token (audience "sigstore") and AWS STS uses it too
      contents: read
    env:
      REF: ${{ inputs.image }}@${{ inputs.digest }}
    steps:
      - name: Check inputs and the caller's ref
        # The SAN names this workflow, not the caller's branch, so this check is
        # what keeps unreviewed branches from producing production signatures.
        # The caller's ref is also in the certificate (githubWorkflowRef).
        env:
          DIGEST: ${{ inputs.digest }}
          IMAGE: ${{ inputs.image }}
          CALLER_REF: ${{ github.ref }}
          CALLER_EVENT: ${{ github.event_name }}
        run: |
          [[ "$CALLER_REF" == refs/heads/main || "$CALLER_REF" == refs/tags/v* ]] \
            || { echo "::error::signing is allowed only from main or release tags (got $CALLER_REF)"; exit 1; }
          # pull_request_target / workflow_run report the BASE ref while the
          # caller may have built untrusted head code: never sign for them.
          case "$CALLER_EVENT" in
            push|workflow_dispatch|release) ;;
            *) echo "::error::signing is not allowed for event '$CALLER_EVENT'"; exit 1 ;;
          esac
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::digest must be sha256:<64 hex>"; exit 1; }
          [[ "$IMAGE" != *@* && "$IMAGE" != *:*/* ]] || { echo "::error::image must not contain a tag or digest"; exit 1; }

      - name: AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: me-central-1

      - name: Registry login
        run: |
          registry="${REF%%/*}"
          aws ecr get-login-password | cosign login "$registry" --username AWS --password-stdin

      - name: Trust the private Sigstore (TUF)
        run: |
          # Corporate root for TLS to *.sigstore.corp.example, added to the system bundle.
          cat /etc/ssl/certs/ca-certificates.crt /etc/sigstore/ca.crt > "$RUNNER_TEMP/ca.pem"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/ca.pem" >> "$GITHUB_ENV"
          SSL_CERT_FILE="$RUNNER_TEMP/ca.pem" cosign initialize \
            --mirror https://tuf.sigstore.corp.example --root /etc/sigstore/tuf-root.json

      - name: Sign
        # Signing config (Fulcio, Rekor, TSA URLs) comes from the TUF repository.
        run: cosign sign --yes "$REF"

      - name: Download SBOM
        if: inputs.sbom-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.sbom-artifact }}
          path: ${{ runner.temp }}/sbom

      - name: Attest SBOM
        if: inputs.sbom-artifact != ''
        run: cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/sbom/sbom.spdx.json" "$REF"

      - name: Verify as admission control will
        env:
          CALLER: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/example-bank/platform-workflows/.github/workflows/sign.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com/example-bank" \
            --certificate-github-workflow-repository "$CALLER" \
            "$REF" > /dev/null
          echo "### Signed \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
