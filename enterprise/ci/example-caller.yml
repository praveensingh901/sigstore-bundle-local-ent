# Example: an application repository's release workflow
# (.github/workflows/release.yml in example-bank/payments-api).
name: release
on:
  push:
    branches: [main]

permissions: {}

env:
  IMAGE: 333333333333.dkr.ecr.me-central-1.amazonaws.com/payments/api

jobs:
  build:
    runs-on: [self-hosted, build]
    timeout-minutes: 30
    permissions:
      id-token: write          # AWS role for ECR push
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::333333333333:role/gha-payments-api-push
          aws-region: me-central-1
      - name: Build
        run: |
          docker build --pull -t "$IMAGE:${GITHUB_SHA::12}" .
          syft "$IMAGE:${GITHUB_SHA::12}" -o spdx-json=sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 7
      - id: push
        name: Push and record the digest
        run: |
          aws ecr get-login-password | docker login "${IMAGE%%/*}" --username AWS --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::12}"
          digest="$(docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA::12}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  sign:
    needs: build
    uses: example-bank/platform-workflows/.github/workflows/sign.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      image: 333333333333.dkr.ecr.me-central-1.amazonaws.com/payments/api
      digest: ${{ needs.build.outputs.digest }}
      sbom-artifact: sbom
      aws-role-arn: arn:aws:iam::333333333333:role/gha-sign-payments-api
