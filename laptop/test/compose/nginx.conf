events {}
http {
  resolver 127.0.0.11 valid=10s;
  ssl_certificate     /etc/nginx/tls.crt;
  ssl_certificate_key /etc/nginx/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;

  server { listen 443 ssl; server_name keycloak.sigstore.local;
    location / { set $u http://keycloak:8080; proxy_pass $u; } }
  server { listen 443 ssl; server_name fulcio.sigstore.local;
    location / { set $u http://fulcio:5555; proxy_pass $u; } }
  server { listen 443 ssl; server_name rekor.sigstore.local;
    location / { set $u http://rekor:3000; proxy_pass $u; } }
  server { listen 443 ssl; server_name tuf.sigstore.local;
    location / { root /usr/share/nginx/tuf; } }
  server { listen 443 ssl; server_name registry.sigstore.local;
    client_max_body_size 0; chunked_transfer_encoding on;
    location / { set $u http://registry:5000; proxy_pass $u; proxy_request_buffering off; } }
}
