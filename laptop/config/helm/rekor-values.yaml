# Rekor: the transparency log for signatures/attestations.
# Chart: sigstore/rekor 1.8.7  (rekor-server v1.5.4)
# Installed into namespace rekor-system as release "rekor".
#
# Components rendered:
#   rekor-server        REST API :3000 (exposed as https://rekor.sigstore.local)
#   rekor-redis         search index (sha -> UUID); rebuildable from the log
#   rekor-createtree    Job: creates a Trillian tree and stores its ID in
#                       ConfigMap rekor-config (key treeID)
forceNamespace: rekor-system
fullnameOverride: rekor
namespace:
  name: rekor-system
  create: false

server:
  fullnameOverride: rekor-server
  # ---- Signer --------------------------------------------------------------
  # Default is "memory": a NEW random key on every restart, which would break
  # every client's trusted root. We use our own key generated by
  # 03-generate-pki.sh and stored in Secret rekor-signer (key: private).
  signer: /var/run/rekor-signer/rekor.key
  signerFileSecretOptions:
    secretName: rekor-signer
    secretMountPath: /var/run/rekor-signer
    secretMountSubPath: rekor.key
    privateKeySecretKey: private
  # The key password is appended by 08-deploy-sigstore.sh:
  #   --set-string 'server.extraArgs[0]=--rekor_server.signer-passwd=<pw>'
  # (see docs/07-security-hardening.md for KMS alternatives in production)
  ingress:
    enabled: true
    className: traefik
    hosts:
      - host: rekor.sigstore.local
        path: /
    tls:
      - secretName: sigstore-tls
        hosts: [rekor.sigstore.local]
  attestation_storage:
    enabled: true
    persistence:
      enabled: true
      size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }

redis:
  fullnameOverride: rekor-redis

createtree:
  fullnameOverride: rekor-createtree

# Trillian is installed separately (trillian-values.yaml); point at it.
trillian:
  enabled: false
  forceNamespace: trillian-system
  logServer:
    name: trillian-logserver
    portRPC: 8091
    portHTTP: 8090
