# Fulcio: the code-signing CA that turns an OIDC identity into a short-lived
# (10 minute) X.509 certificate.
# Chart: sigstore/fulcio 2.11.4  (fulcio v1.9.0)
# Installed into namespace fulcio-system as release "fulcio".
#
# The OIDC issuer list lives in a SECOND values file rendered at deploy time:
#   .generated/fulcio-config-values.yaml  (from fulcio-config-values.yaml.tpl)
# because it embeds the TLS CA certificate generated by 03-generate-pki.sh.
forceNamespace: fulcio-system
namespace:
  name: fulcio-system
  create: false

server:
  fullnameOverride: fulcio-server
  replicaCount: 1
  # Secret created by 08-deploy-sigstore.sh from pki/fulcio:
  #   private  -> intermediate.key (encrypted PKCS#8)
  #   cert     -> chain.pem (intermediate first, root last)
  #   password -> FULCIO_CA_PASSWORD
  #   public   -> intermediate public key (informational)
  secret: fulcio-server-secret
  args:
    certificateAuthority: fileca
    # The CT log is a separate release (ctlog-values.yaml); prefix "sigstore".
    ct_log_url: http://ctlog.ctlog-system.svc/sigstore
  logging:
    production: true
  ingress:
    http:
      enabled: true
      className: traefik
      hosts:
        - host: fulcio.sigstore.local
          path: /
      tls:
        - secretName: sigstore-tls
          hosts: [fulcio.sigstore.local]
    grpc:
      enabled: false          # cosign talks to Fulcio over HTTP/JSON
  resources:
    requests: { cpu: 50m, memory: 64Mi }

# We bring our own CA (pki/fulcio). Disable the chart's self-signed generator.
createcerts:
  enabled: false

# The CT log is installed as its own release; do not install the sub-chart.
ctlog:
  enabled: false
